# RCA inference server, deployed next to the opentelemetry-demo Helm release.
#
#   kubectl apply -f deploy/k8s/rca-serve.yaml
#
# Apply this BEFORE `helm install`: deploy/k8s/values-demo.yaml mounts the rca-capture
# PVC below into the collector, and the collector pod stays Pending until the claim
# exists. (Applying it afterwards also works -- the pod recovers once the PVC binds --
# but the capture files then start mid-run.)
#
# Install both into the same namespace; the JAEGER_URL / GRAFANA_URL values below use
# bare service names, which only resolve inside the release's namespace.
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: rca-capture
spec:
  # ReadWriteOnce, not ReadWriteMany, and the reason matters: kind's default
  # StorageClass (`standard`, rancher local-path-provisioner) REJECTS any other mode --
  # its provisioner returns "NodePath only supports ReadWriteOnce and ReadWriteOncePod
  # (1.22+) access modes". RWO means one NODE, not one pod, so the collector pod and the
  # rca-serve pod below can both mount it as long as they land on the same node. On a
  # single-node kind/minikube cluster that is automatic.
  #
  # Multi-node: the collector runs as a DaemonSet (chart default), so there is one
  # collector pod per node and they cannot all reach an RWO volume. Switch to
  # ReadWriteMany with a provisioner that supports it (NFS, CephFS, ...) and accept that
  # every collector appends into the same three files, or set
  # `opentelemetry-collector.mode: deployment` in values-demo.yaml to get a single
  # collector and keep RWO.
  accessModes: [ReadWriteOnce]
  resources:
    requests:
      # A campaign's traces dominate: rotation is off, so the files grow for the whole
      # run. 20Gi is a couple of hours of demo traffic; size for the campaign you plan.
      storage: 20Gi
  # storageClassName: standard   # uncomment to pin; omitted = the cluster default
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: rca-serve
  labels:
    app.kubernetes.io/name: rca-serve
spec:
  # One replica by design: the streaming detector holds incident state in memory, and a
  # second replica would tail the same files and produce a second, divergent verdict.
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: rca-serve
  template:
    metadata:
      labels:
        app.kubernetes.io/name: rca-serve
    spec:
      containers:
        - name: rca-serve
          # Built from deploy/Dockerfile with the model baked in (see README). Never
          # `latest`: the image IS the model version.
          image: rca-serve:local
          # The image is loaded into the node by `kind load` / `minikube image load`,
          # not pulled from a registry.
          imagePullPolicy: IfNotPresent
          # ENTRYPOINT is ["rca", "serve"]; these are its flags.
          args:
            - --model
            - /opt/rca/model
            - --capture
            - /capture
            - --host
            - 0.0.0.0
            - --port
            - "8000"
          env:
            # Evidence-link base URLs, read by rca.serve.api.Links.from_env().
            #
            # These are the chart's in-cluster services, verified in the chart's
            # values.yaml: the frontend-proxy component is configured with
            # JAEGER_HOST=jaeger / JAEGER_UI_PORT=16686 and GRAFANA_HOST=grafana /
            # GRAFANA_PORT=80, jaeger_query is configured with `base_path: /jaeger/ui`,
            # and grafana.ini sets root_url .../grafana with serve_from_sub_path: true.
            #
            # CAVEAT: these URLs are rendered into links that a BROWSER follows, and a
            # browser outside the cluster cannot resolve `jaeger` or `grafana`. When you
            # reach the UI by port-forwarding frontend-proxy to localhost:8080 (the
            # README quickstart), set these to the proxied paths instead -- which are
            # also the built-in defaults, so you can simply delete both entries:
            #   JAEGER_URL:  http://localhost:8080/jaeger/ui
            #   GRAFANA_URL: http://localhost:8080/grafana
            - name: JAEGER_URL
              value: http://jaeger:16686/jaeger/ui
            - name: GRAFANA_URL
              value: http://grafana/grafana
            # GRAFANA_METRICS_DATASOURCE / GRAFANA_LOGS_DATASOURCE are left at their
            # defaults (webstore-metrics / webstore-logs); those are exactly the
            # datasource UIDs the chart provisions in grafana/provisioning/datasources.
          ports:
            - name: http
              containerPort: 8000
          volumeMounts:
            # Read-only: this pod only tails the files the collector appends to. The
            # collector writes them as root, but the file exporter creates them with
            # mode 0644 (`defaultFilePermissions = 0o644` in contrib's
            # exporter/fileexporter/factory.go), so the non-root user below can read
            # them as long as /capture itself is traversable -- local-path and
            # minikube-hostpath both create the backing directory world-accessible.
            - name: rca-capture
              mountPath: /capture
              readOnly: true
          securityContext:
            # Matches the `rca` user deploy/Dockerfile creates (uid/gid 10001), so HOME
            # exists inside the container.
            runAsNonRoot: true
            runAsUser: 10001
            runAsGroup: 10001
            allowPrivilegeEscalation: false
            capabilities:
              drop: [ALL]
            # NOT readOnlyRootFilesystem: rca.serve.stream._Tail writes each polled
            # chunk to a NamedTemporaryFile before parsing it, so /tmp must be writable.
          resources:
            requests:
              cpu: 250m
              memory: 512Mi
            limits:
              memory: 1Gi
          # Readiness is "a baseline is fitted, so the verdicts mean something"; the
          # warm-up (and a sliding warm-up that keeps rejecting a degraded period) can
          # take several minutes, which is why the failure budget is generous.
          readinessProbe:
            httpGet:
              path: /ready
              port: http
            initialDelaySeconds: 15
            periodSeconds: 10
            failureThreshold: 60
          # Liveness is "the ingest pump is still running": /health fails only once the
          # pump thread has died or given up after repeated frame failures.
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 30
            periodSeconds: 30
            failureThreshold: 3
      volumes:
        - name: rca-capture
          persistentVolumeClaim:
            claimName: rca-capture
            readOnly: true
---
apiVersion: v1
kind: Service
metadata:
  name: rca-serve
  labels:
    app.kubernetes.io/name: rca-serve
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: rca-serve
  ports:
    - name: http
      port: 8000
      targetPort: http
