[build-system]
requires = ["setuptools>=77"]   # >=77 for the PEP 639 `license` / `license-files` form
build-backend = "setuptools.build_meta"

[project]
name = "rca"
version = "0.1.0"
description = "Cloud-outage root-cause AI: incident detection, root-service localization and fault classification from microservice telemetry"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.12"
dependencies = [
    "numpy>=2",
    "pandas>=2.2",
    "pyarrow>=15",
    "scikit-learn>=1.5",
    "xgboost>=2.1",
    "pyyaml>=6",
    "fastapi>=0.110",
    "uvicorn>=0.29",
    "mlflow>=2.12",
    "typer>=0.12",
    "requests>=2.31",
    "joblib>=1.3",
]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.5", "httpx>=0.27"]

[project.scripts]
rca = "rca.cli.main:app"

[tool.setuptools.packages.find]
include = ["rca*"]

[tool.setuptools.package-data]
"rca.serve" = ["ui/*.html"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint.flake8-bugbear]
extend-immutable-calls = ["typer.Option", "typer.Argument"]

[tool.pytest.ini_options]
testpaths = ["tests"]
